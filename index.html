<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskMaster Pro</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:rgba(255,255,255,.72);--ink:#16203a;--mut:#5d6985;--line:rgba(22,32,58,.12);--ac:#5b5bf0;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--info:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1224;--card:rgba(30,38,68,.7);--ink:#e8ecfa;--mut:#9aa6c8;--line:rgba(255,255,255,.12)}}
:root[data-theme=dark]{--bg:#0d1224;--card:rgba(30,38,68,.7);--ink:#e8ecfa;--mut:#9aa6c8;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--ac) 25%,transparent),transparent),var(--bg);transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:flex;height:100%}
aside{width:250px;padding:14px;overflow:auto;border-right:1px solid var(--line);background:var(--card);backdrop-filter:blur(18px);flex-shrink:0;transition:width .2s}
aside.c{width:66px}aside.c .lb,aside.c h6,aside.c .cnt{display:none}
aside h6{margin:16px 8px 6px;color:var(--mut);font-size:12px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:12px;text-align:left}
.nav:hover{background:var(--line)}.nav.on{background:var(--ac);color:#fff}
.cnt{margin-left:auto;font-size:12px;background:var(--line);border-radius:99px;padding:0 8px}
.nav.on .cnt{background:rgba(255,255,255,.25)}
main{flex:1;overflow:auto;padding:18px;min-width:0}
header.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
header.top h1{margin:0;font-size:22px;flex:1;min-width:160px}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 28px rgba(10,20,50,.08)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:14px}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.big{font-size:26px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px}
.btn.p{background:var(--ac);color:#fff;border-color:transparent}.btn.d{color:var(--bad)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;width:100%}
.task{display:flex;gap:10px;align-items:flex-start;padding:12px;margin-bottom:8px}
.task.sel{outline:2px solid var(--ac)}.task.done .tt{text-decoration:line-through;opacity:.6}
.tt{font-weight:600}.bd{display:inline-block;font-size:11px;border-radius:99px;padding:1px 8px;margin:2px 4px 0 0;background:var(--line)}
.High{background:#dc262622;color:var(--bad)}.Medium{background:#d9770622;color:var(--warn)}.Low{background:#2563eb22;color:var(--info)}
.od{background:#dc262622;color:var(--bad)}.ck{width:22px;height:22px;accent-color:var(--ok);margin-top:2px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.col{min-height:160px}.col.over{outline:2px dashed var(--ac)}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}.empty b{display:block;font-size:34px}
.modal{position:fixed;inset:0;background:rgba(5,10,30,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal.on{display:flex}.modal>.card{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>*{flex:1;min-width:130px}
#toasts{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:99;display:grid;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;animation:in .25s;border-left:5px solid var(--info)}
.toast.success{border-color:var(--ok)}.toast.error{border-color:var(--bad)}.toast.warning{border-color:var(--warn)}
@keyframes in{from{transform:translateX(30px);opacity:0}}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:28px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:30}
.bnav{display:none}
@media(max-width:800px){aside{position:fixed;z-index:40;height:100%;left:-270px;transition:left .2s}aside.open{left:0}
.bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav button{flex:1;border:0;background:none;padding:10px 0;font-size:12px}main{padding-bottom:90px}.modal>.card{max-height:100vh;height:100%;border-radius:0}}
.ring{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;margin:10px auto}
.ring div{width:156px;height:156px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:38px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .d{min-height:74px;padding:4px;border-radius:10px;border:1px solid var(--line);font-size:12px;overflow:hidden}
.cal .d.over{outline:2px dashed var(--ac)}.cal .ev{display:block;font-size:11px;background:var(--ac);color:#fff;border-radius:6px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pal input{margin-bottom:8px}.pi{display:block;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:8px}.pi:hover,.pi.on{background:var(--line)}
.off{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<div id="toasts" aria-live="polite"></div>
<div id="auth" class="modal on"><div class="card" id="authBox"></div></div>
<div class="app" id="app" hidden>
<aside id="side" aria-label="Sidebar"></aside>
<main id="main"></main></div>
<nav class="bnav" id="bnav"></nav>
<button class="fab" id="fab" aria-label="Quick add task">+</button>
<div id="tm" class="modal"><div class="card" id="tmBox"></div></div>
<div id="pal" class="modal"><div class="card"><input id="pq" placeholder="Type a command…" aria-label="Command palette"><div id="pl"></div></div></div>

<script>
/* ===== Firebase config placeholders (paste your real values; auth is NOT faked locally) ===== */
const firebaseConfig={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT_ID",storageBucket:"YOUR_PROJECT.appspot.com",messagingSenderId:"YOUR_SENDER_ID",appId:"YOUR_APP_ID"};
const FB_READY=!firebaseConfig.apiKey.startsWith("YOUR_");
/* Wire-up point: load firebase-app/auth/firestore compat scripts, call firebase.initializeApp(firebaseConfig),
   then replace Auth.* below with firebase.auth() calls and saveState() with Firestore writes. */

const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10);
const DAY=864e5,ymd=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>ymd(Date.now()),addD=(s,n)=>ymd(new Date(s+'T12:00').getTime()+n*DAY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=['Work','Personal','Study','Fitness','Shopping'],PRI=['High','Medium','Low'],STAT=['Pending','In Progress','Completed','Waiting','Cancelled','Archived'];
const ACH=[['first','First step','Complete 1 task',s=>done(s).length>=1],['ten','Getting going','Complete 10 tasks',s=>done(s).length>=10],['focus','Deep focus','Finish a focus session',s=>s.sessions.length>=1],['streak3','On a roll','3-day streak',s=>s.streak>=3],['lvl3','Level 3','Reach level 3',s=>lvl(s.xp)>=3],['habit','Habit builder','Create a habit',s=>s.habits.length>=1]];
const done=s=>s.tasks.filter(t=>t.status==='Completed');
const lvl=x=>Math.floor(Math.sqrt(x/100))+1,lvlBase=l=>(l-1)**2*100;

/* ===== State ===== */
let state=null,view='dashboard',lv='list',filter={q:'',f:'all',sort:'due',cat:'',proj:''},sel=new Set(),cur=null,edit=null;
const fresh=()=>({user:null,tasks:[],projects:[{id:'p1',name:'Work Projects',color:'#2563eb'},{id:'p2',name:'Personal',color:'#16a34a'}],habits:[],notifications:[],achievements:[],xp:0,level:1,streak:0,lastDay:null,sessions:[],templates:[],settings:{theme:'system',accent:'#5b5bf0',sound:true},savedFilters:[],activity:[]});
function saveState(){try{localStorage.setItem('tmp_state',JSON.stringify(state))}catch(e){}}
function loadState(){try{state={...fresh(),...JSON.parse(localStorage.getItem('tmp_state')||'{}')}}catch(e){state=fresh()}}
/* Never store passwords. Only the profile returned by the auth provider is kept. */

/* ===== Toasts / audio / XP ===== */
function toast(m,t='info'){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),3200)}
let AC;function chime(){if(!state.settings.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();[660,880,1175].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.15,AC.currentTime+i*.09);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+i*.09+.3);o.connect(g).connect(AC.destination);o.start(AC.currentTime+i*.09);o.stop(AC.currentTime+i*.09+.3)})}catch(e){}}
function party(){if(window.confetti&&!matchMedia('(prefers-reduced-motion:reduce)').matches)confetti({particleCount:90,spread:70,origin:{y:.7}})}
function addXP(n){const b=lvl(state.xp);state.xp+=n;state.level=lvl(state.xp);if(state.level>b){toast('Level up! You are now level '+state.level,'success');party()}checkAch()}
function checkAch(){ACH.forEach(a=>{if(!state.achievements.includes(a[0])&&a[3](state)){state.achievements.push(a[0]);toast('Achievement unlocked: '+a[1],'success');notify('Achievement: '+a[1])}})}
function notify(m){state.notifications.unshift({id:uid(),m,at:Date.now(),read:false})}
function log(m){state.activity.unshift({m,at:Date.now()});state.activity.length=Math.min(state.activity.length,50)}
function bumpStreak(){const t=today();if(state.lastDay===t)return;state.streak=state.lastDay===addD(t,-1)?state.streak+1:1;state.lastDay=t}

/* ===== Task helpers ===== */
const isOver=t=>t.due&&t.status!=='Completed'&&t.status!=='Archived'&&t.status!=='Cancelled'&&(t.due<today());
const live=t=>!['Completed','Archived','Cancelled'].includes(t.status);
const newTask=o=>({id:uid(),title:'',description:'',notes:'',category:'Work',project:'',priority:'Medium',status:'Pending',due:'',time:'',created:Date.now(),updated:Date.now(),completed:null,tags:[],assignee:'',subtasks:[],attachments:[],est:0,actual:0,recur:'none',interval:1,reminder:'',starred:false,deps:[],comments:[],history:[],timerStart:null,quad:'',...o});
function nextDue(t){const d=t.due||today(),n=t.interval||1;if(t.recur==='daily')return addD(d,n);if(t.recur==='weekday'){let x=addD(d,1);while([0,6].includes(new Date(x+'T12:00').getDay()))x=addD(x,1);return x}if(t.recur==='weekly')return addD(d,7*n);if(t.recur==='monthly'){const x=new Date(d+'T12:00');x.setMonth(x.getMonth()+n);return ymd(x)}return ''}
function completeTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;if(t.status==='Completed'){t.status='Pending';t.completed=null;render();saveState();return}
 t.status='Completed';t.completed=Date.now();t.updated=Date.now();t.subtasks.forEach(s=>s.done=true);log('Completed "'+t.title+'"');bumpStreak();
 if(t.recur!=='none'){const n=newTask({...t,id:uid(),status:'Pending',completed:null,due:nextDue(t),subtasks:t.subtasks.map(s=>({...s,done:false})),comments:[],history:[]});state.tasks.push(n);toast('Next occurrence: '+n.due)}
 addXP(50);chime();party();toast('Task completed! +50 XP','success');saveState();render()}
function deleteTask(id){const t=state.tasks.find(x=>x.id===id);if(!t||!confirm('Delete "'+t.title+'"?'))return;state.tasks=state.tasks.filter(x=>x.id!==id);sel.delete(id);log('Deleted "'+t.title+'"');saveState();render();toast('Task deleted','warning')}
function duplicateTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;state.tasks.push(newTask({...t,id:uid(),title:t.title+' (copy)',status:'Pending',completed:null,created:Date.now(),subtasks:t.subtasks.map(s=>({...s,id:uid()}))}));saveState();render();toast('Task duplicated','success')}
function archiveTask(id){const t=state.tasks.find(x=>x.id===id);t.status='Archived';saveState();render();toast('Task archived')}
function restoreTask(id){const t=state.tasks.find(x=>x.id===id);t.status='Pending';t.completed=null;saveState();render();toast('Task restored','success')}
function snooze(id){const t=state.tasks.find(x=>x.id===id);t.due=addD(t.due||today(),1);saveState();render();toast('Snoozed to '+t.due)}
function toggleTimer(id){const t=state.tasks.find(x=>x.id===id);if(t.timerStart){t.actual+=Math.round((Date.now()-t.timerStart)/60000*10)/10;t.timerStart=null;toast('Timer stopped')}else{t.timerStart=Date.now();toast('Timer started')}saveState();render()}

/* ===== Smart parse ===== */
function parseNL(s){let txt=s,o={},lo=s.toLowerCase();
 const cut=r=>{txt=txt.replace(r,'')};
 if(/\btomorrow\b/.test(lo)){o.due=addD(today(),1);cut(/\btomorrow\b/i)}else if(/\btoday\b/.test(lo)){o.due=today();cut(/\btoday\b/i)}else if(/\bnext week\b/.test(lo)){o.due=addD(today(),7);cut(/\bnext week\b/i)}
 else{const days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];days.forEach((d,i)=>{if(new RegExp('\\b'+d+'\\b').test(lo)){const n=(i-new Date().getDay()+7)%7||7;o.due=addD(today(),n);cut(new RegExp('\\b'+d+'\\b','i'))}})}
 const tm=lo.match(/\b(?:at\s*)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);if(tm){let h=+tm[1]%12+(tm[3]==='pm'?12:0);o.time=String(h).padStart(2,'0')+':'+(tm[2]||'00');txt=txt.replace(/\b(?:at\s*)?\d{1,2}(?::\d{2})?\s*(am|pm)\b/i,'')}
 else if(/\bmorning\b/.test(lo)){o.time='09:00';cut(/\bmorning\b/i)}else if(/\bafternoon\b/.test(lo)){o.time='14:00';cut(/\bafternoon\b/i)}else if(/\bevening\b/.test(lo)){o.time='19:00';cut(/\bevening\b/i)}
 const p=lo.match(/\b(high|medium|low)\s*priority\b/);if(p){o.priority=p[1][0].toUpperCase()+p[1].slice(1);cut(/\b(high|medium|low)\s*priority\b/i)}
 const tags=[...s.matchAll(/#(\w+)/g)].map(m=>m[1]);if(tags.length){o.tags=tags;cut(/#\w+/g)}
 if(/assignment|homework|exam|study|essay|math|read/.test(lo))o.category='Study';else if(/gym|run|workout|yoga/.test(lo))o.category='Fitness';else if(/buy|shop|groceries/.test(lo))o.category='Shopping';else if(/meeting|report|email|client|project/.test(lo))o.category='Work';
 o.title=txt.replace(/\s+/g,' ').replace(/\b(at|on|by)\s*$/i,'').trim();return o}

/* ===== Filtering ===== */
function visible(){let a=state.tasks.slice();const f=filter,T=today();
 if(view==='today')a=a.filter(t=>t.due===T&&live(t));else if(view==='tomorrow')a=a.filter(t=>t.due===addD(T,1)&&live(t));else if(view==='upcoming')a=a.filter(t=>t.due>T&&live(t));else if(view==='overdue')a=a.filter(isOver);else if(view==='completed')a=a.filter(t=>t.status==='Completed');
 else if(view.startsWith('proj:'))a=a.filter(t=>t.project===view.slice(5));else if(view==='all'||view==='tasks')a=a.filter(t=>t.status!=='Archived');
 const F={active:live,completed:t=>t.status==='Completed',today:t=>t.due===T,tomorrow:t=>t.due===addD(T,1),upcoming:t=>t.due>T,overdue:isOver,High:t=>t.priority==='High',Medium:t=>t.priority==='Medium',Low:t=>t.priority==='Low',archived:t=>t.status==='Archived'};
 if(F[f.f])a=a.filter(F[f.f]);if(f.cat)a=a.filter(t=>t.category===f.cat);if(f.proj)a=a.filter(t=>t.project===f.proj);
 if(f.q){const q=f.q.toLowerCase();a=a.filter(t=>[t.title,t.description,t.notes,t.category,projName(t.project),...t.tags].join(' ').toLowerCase().includes(q))}
 const po={High:0,Medium:1,Low:2};a.sort({due:(x,y)=>(x.due||'9')<(y.due||'9')?-1:1,created:(x,y)=>y.created-x.created,updated:(x,y)=>y.updated-x.updated,priority:(x,y)=>po[x.priority]-po[y.priority],alpha:(x,y)=>x.title.localeCompare(y.title),completion:(x,y)=>(x.status==='Completed')-(y.status==='Completed')}[f.sort]);return a}
const projName=id=>(state.projects.find(p=>p.id===id)||{}).name||'';
const counts=()=>({upcoming:state.tasks.filter(t=>t.due>today()&&live(t)).length,overdue:state.tasks.filter(isOver).length,completed:done(state).length,notif:state.notifications.filter(n=>!n.read).length});

/* ===== Rendering ===== */
const NAV=[['WORKSPACE',[['dashboard','📊','Dashboard'],['all','🗂','All Tasks'],['today','☀️','Today'],['tomorrow','🌅','Tomorrow'],['upcoming','📅','Upcoming','upcoming'],['overdue','⚠️','Overdue','overdue'],['completed','✅','Completed','completed'],['calendar','🗓','Calendar'],['board','🧱','Board'],['timeline','⏳','Timeline'],['matrix','🎯','Eisenhower Matrix']]],
['PRODUCTIVITY & AI',[['habits','🔥','Habit Tracker'],['focus','⏱','Pomodoro Timer'],['coach','✨','AI Focus Coach'],['planner','🧠','AI Daily Planner'],['analytics','📈','Analytics']]],
['GAMIFICATION',[['achievements','🏆','Achievements & Level']]],
['MORE',[['templates','📋','Templates'],['automations','⚙️','Automations'],['integrations','🔌','Integrations'],['notifications','🔔','Notifications','notif'],['settings','👤','Account & Settings']]]];
function renderSide(){const c=counts();let h=`<div style="display:flex;justify-content:space-between;align-items:center"><b class="lb" style="font-size:18px">TaskMaster Pro</b><button class="btn" id="col" aria-label="Collapse sidebar">☰</button></div>`;
 NAV.forEach(([g,items])=>{h+=`<h6>${g}</h6>`;items.forEach(([k,i,l,c2])=>h+=`<button class="nav ${view===k?'on':''}" data-nav="${k}"><span>${i}</span><span class="lb">${l}</span>${c2?`<span class="cnt">${c[c2]}</span>`:''}</button>`)});
 h+=`<h6>PROJECTS</h6><button class="nav" id="newProj"><span>＋</span><span class="lb">New</span></button>`;
 state.projects.forEach(p=>{const n=state.tasks.filter(t=>t.project===p.id).length;h+=`<button class="nav ${view==='proj:'+p.id?'on':''}" data-nav="proj:${p.id}"><span style="color:${p.color}">●</span><span class="lb">${esc(p.name)}</span><span class="cnt">${n}</span></button>`});
 $('#side').innerHTML=h;
 $('#bnav').innerHTML=[['dashboard','📊','Home'],['all','🗂','Tasks'],['calendar','🗓','Calendar'],['focus','⏱','Focus'],['menu','☰','More']].map(([k,i,l])=>`<button data-nav="${k}" aria-label="${l}">${i}<br>${l}</button>`).join('')}
function head(t,extra=''){return `<header class="top"><button class="btn" data-act="menu" aria-label="Open menu" style="display:${innerWidth<=800?'block':'none'}">☰</button><h1>${t}</h1><input id="gs" placeholder="Search ( / )" value="${esc(filter.q)}" style="max-width:220px" aria-label="Search tasks"><button class="btn" data-act="theme" aria-label="Toggle theme">🌓</button><span class="off" id="net"></span>${extra}<button class="btn p" data-act="new">+ New task</button></header>`}
function taskCard(t){const st=t.subtasks.length?Math.round(t.subtasks.filter(s=>s.done).length/t.subtasks.length*100):null;
 return `<div class="card task ${t.status==='Completed'?'done':''} ${sel.has(t.id)?'sel':''}" data-id="${t.id}" draggable="true" tabindex="0">
 <input type="checkbox" class="ck" data-act="sel" ${sel.has(t.id)?'checked':''} aria-label="Select task" style="accent-color:var(--ac)">

/* Reminders & overdue check */
function checkReminders(){const now=Date.now();state.tasks.filter(live).forEach(t=>{if(!t.due)return;const due=new Date(t.due+'T'+(t.time||'09:00')).getTime(),lead=t.reminder===''?null:+t.reminder*60000;
 if(isOver(t)&&!t._ov){t._ov=1;notify('Overdue: '+t.title)}if(lead!==null&&!t._rm&&now>=due-lead&&now<due+36e5){t._rm=1;notify('Reminder: '+t.title);toast('Reminder: '+t.title,'warning');if('Notification' in window&&Notification.permission==='granted')new Notification('TaskMaster Pro',{body:t.title})}});renderSide()}

/* ===== Boot ===== */
loadState();applyTheme();
if(state.user){$('#auth').classList.remove('on');$('#app').hidden=false}else drawAuth();
$('#main').innerHTML='<div class="card"><div class="bar"><i style="width:60%"></i></div></div>';
render();setInterval(tick,30000);setInterval(checkReminders,60000);setTimeout(checkReminders,1500);
</script></body></html>
